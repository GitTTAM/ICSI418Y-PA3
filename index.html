<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt's Task List for 418Y</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page">
        <h1>Matt's Task List for 418Y</h1>

        <form id="task-form" class="task-form">
            <label for="task-input">Task <span class="required-text">(required)</span>:</label>
            <input id="task-input" type="text" placeholder="Enter a task" required aria-describedby="message">

            <label for="priority">Priority:</label>
            <select id="priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>

            <button id="add-task-button" type="submit">Add Task</button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>
        <div id="task-list" class="task-list"></div>
    </main>
</body>
</html>
